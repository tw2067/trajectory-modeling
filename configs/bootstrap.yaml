"""
Bootstrap configuration for trajectory feature extraction.
"""
backend: bootstrap

# Window configuration
window_years: 3.0              # Lookback window size (days for clinical data)
min_points_per_window: 4       # Minimum observations required

# Bootstrap parameters
n_bootstrap: 500               # Number of bootstrap samples per window
smoothing: null                # Auto-select spline smoothing (or set to e.g., 1.0)

# Classification thresholds
flat_thr: 10.0                 # Stable trajectory threshold
decline_thr: 30.0              # Improvement/decline threshold (positive for improvement)
nonlinear_gap: 20.0            # Nonlinear detection threshold

# Evaluation grid
grid_freq: 12                  # Number of points for trajectory evaluation

# Processing
n_jobs: -1                     # Number of parallel jobs (-1 = all cores)
progressbar: true              # Show progress during processing

# Column names (adjust for your dataset)
pids: patientid
values: lab_value
time_col: time_days
windowing_col: time_day
